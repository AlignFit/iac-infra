AWSTemplateFormatVersion: "2010-09-09"

Description: Storage Align Fit

Resources:
  # -------------------------------------------------------
  # Vídeos brutos enviados pelos usuários
  # -------------------------------------------------------
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub raw-s3-${AWS::AccountId}

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - "*"
            MaxAge: 3000

      Tags:
        - Key: Name
          Value: RawBucket

  # -------------------------------------------------------
  # CSVs de keypoints extraídos pelo YOLO + CSV mestre incremental
  # -------------------------------------------------------
  ClientBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub client-s3-${AWS::AccountId}

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      Tags:
        - Key: Name
          Value: ClientBucket

  # -------------------------------------------------------
  # Modelos de ML treinados (.pkl)
  # -------------------------------------------------------
  ModelsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub model-s3-${AWS::AccountId}

      Tags:
        - Key: Name
          Value: ModelsBucket

  # -------------------------------------------------------
  # Resultados de inferência em JSON (polling pelo frontend)
  # -------------------------------------------------------
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub result-s3-${AWS::AccountId}

      # Permitir acesso público (necessário para Grafana Infinity)
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - GET
            AllowedHeaders:
              - "*"
            MaxAge: 3000

      Tags:
        - Key: Name
          Value: ResultsBucket

  # Política de leitura pública apenas para results/historico.json
  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadHistorico
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::result-s3-${AWS::AccountId}/results/historico.json

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
    Export:
      Name: RawBucketName

  ClientBucketName:
    Value: !Ref ClientBucket
    Export:
      Name: ClientBucketName

  ModelsBucketName:
    Value: !Ref ModelsBucket
    Export:
      Name: ModelsBucketName

  ResultsBucketName:
    Value: !Ref ResultsBucket
    Export:
      Name: ResultsBucketName
