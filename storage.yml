AWSTemplateFormatVersion: "2010-09-09"

Description: Storage Align Fit

Resources:
  # -------------------------------------------------------
  # Vídeos brutos enviados pelos usuários
  # -------------------------------------------------------
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub raw-s3-${AWS::AccountId}

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "*"
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - "*"
            MaxAge: 3000

      Tags:
        - Key: Name
          Value: RawBucket

  # -------------------------------------------------------
  # CSVs de keypoints extraídos pelo YOLO + CSV mestre incremental
  # -------------------------------------------------------
  ClientBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub client-s3-${AWS::AccountId}

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

      Tags:
        - Key: Name
          Value: ClientBucket

  # -------------------------------------------------------
  # Modelos de ML treinados (.pkl)
  # -------------------------------------------------------
  ModelsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub model-s3-${AWS::AccountId}

      Tags:
        - Key: Name
          Value: ModelsBucket

  # -------------------------------------------------------
  # Resultados de inferência em JSON (polling pelo frontend)
  # -------------------------------------------------------
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub result-s3-${AWS::AccountId}

      Tags:
        - Key: Name
          Value: ResultsBucket

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
    Export:
      Name: RawBucketName

  ClientBucketName:
    Value: !Ref ClientBucket
    Export:
      Name: ClientBucketName

  ModelsBucketName:
    Value: !Ref ModelsBucket
    Export:
      Name: ModelsBucketName

  ResultsBucketName:
    Value: !Ref ResultsBucket
    Export:
      Name: ResultsBucketName
